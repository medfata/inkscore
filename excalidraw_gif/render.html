<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Excalifont";
    src: url("assets/Excalifont.woff2") format("woff2");
  }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #stage { width: 960px; height: 540px; }
  text { font-family: "Excalifont", "Comic Sans MS", cursive; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="assets/rough.js"></script>
<script>
// ---------------------------------------------------------------- palette
// Excalidraw's own color palette
const INK   = "#1e1e1e";
const BLUE  = "#1971c2";
const ORANGE= "#e8590c";
const GREEN = "#2f9e44";
const PURPLE= "#6741d9";
const REQ   = "#2f9e44";
const RES   = "#e8590c";

// ---------------------------------------------------------------- scene
const W = 960, H = 540;
const NODES = [
  { label: "Client",        sub: "browser",    color: BLUE,   icon: "monitor"   },
  { label: "Load Balancer", sub: "nginx",      color: ORANGE, icon: "balancer"  },
  { label: "API Server",    sub: "REST / gRPC",color: GREEN,  icon: "server"    },
  { label: "Database",      sub: "PostgreSQL", color: PURPLE, icon: "database"  },
];
const TITLE = "How a Request Flows Through a System";

const NW = 200, NH = 110, NY = 300;
const MARGIN = 50;
const GAP = (W - 2*MARGIN - NW*4) / 3;

function nodeBox(i) {
  const x = MARGIN + i * (NW + GAP);
  return { x, y: NY, w: NW, h: NH,
           cx: x + NW/2, cy: NY + NH/2 };
}

// ---------------------------------------------------------------- timeline
const ARROW_F = 10, TRAVEL_F = 32, HOLD_F = 18;
const ARROW_END = 3 * ARROW_F;                 // 30
const REQ_END   = ARROW_END + TRAVEL_F;        // 62
const RES_END   = REQ_END + TRAVEL_F;          // 94
const TOTAL     = RES_END + HOLD_F;            // 112

const easeInOut = t => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));

// ---------------------------------------------------------------- icons
// Drawn with roughjs in Excalidraw's hand-drawn style
function drawIcon(rc, kind, cx, cy, s, color, opts) {
  if (kind === "monitor") {
    rc.rectangle(cx - s, cy - s*0.75, s*2, s*1.5, opts);
    rc.line(cx, cy + s*0.75, cx, cy + s*1.15, opts);
    rc.line(cx - s*0.6, cy + s*1.15, cx + s*0.6, cy + s*1.15, opts);
  } else if (kind === "balancer") {
    rc.circle(cx, cy, s*2.1, opts);
    for (const dy of [-s*0.7, 0, s*0.7]) {
      rc.line(cx - s*0.55, cy + dy, cx + s*0.85, cy + dy, opts);
    }
  } else if (kind === "server") {
    rc.rectangle(cx - s, cy - s*1.1, s*2, s*0.95, opts);
    rc.rectangle(cx - s, cy - s*0.05, s*2, s*0.95, opts);
    rc.circle(cx - s*0.6, cy - s*0.62, s*0.28, opts);
    rc.circle(cx - s*0.6, cy + s*0.42, s*0.28, opts);
  } else if (kind === "database") {
    rc.ellipse(cx, cy - s*0.75, s*2, s*0.7, opts);
    rc.line(cx - s, cy - s*0.75, cx - s, cy + s*0.7, opts);
    rc.line(cx + s, cy - s*0.75, cx + s, cy + s*0.7, opts);
    rc.arc(cx, cy + s*0.7, s*2, s*0.7, Math.PI, 2*Math.PI, false, opts);
  }
}

// ---------------------------------------------------------------- render
function renderFrame(frame) {
  const svgNS = "http://www.w3.org/2000/svg";
  const stage = document.getElementById("stage");
  stage.innerHTML = "";

  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  stage.appendChild(svg);

  // Excalidraw's "boiling" effect: reseed the sketchy strokes every few
  // frames so lines subtly wobble like the real editor does.
  const boil = Math.floor(frame / 4) % 3;
  // rough.js SVG API RETURNS the drawn node - it must be appended manually.
  // Wrap every method so it auto-appends to the svg.
  const rc0 = rough.svg(svg, { options: { seed: 1 } });
  const rc = {};
  for (const m of ["line","rectangle","ellipse","circle","linearPath",
                   "polygon","arc","curve","path"]) {
    rc[m] = (...args) => { const g = rc0[m](...args); svg.appendChild(g); return g; };
  }
  const O = (seed, color, extra = {}) => ({
    seed: seed * 7 + boil * 101,
    stroke: color, strokeWidth: 2,
    roughness: 1, bowing: 1,
    ...extra,
  });

  // ---- title
  const title = document.createElementNS(svgNS, "text");
  title.setAttribute("x", W/2); title.setAttribute("y", 70);
  title.setAttribute("text-anchor", "middle");
  title.setAttribute("font-size", "34"); title.setAttribute("fill", INK);
  title.textContent = TITLE;
  svg.appendChild(title);

  // ---- nodes: ALL VISIBLE FROM FRAME 0 (per spec)
  for (let i = 0; i < 4; i++) {
    const n = NODES[i], b = nodeBox(i);
    let so = O(11 + i, n.color, { fill: "#ffffff", fillStyle: "solid" });
    if (i === activeNode(frame)) {
      // pulse: a second, larger sketchy outline + thicker stroke
      rc.rectangle(b.x - 6, b.y - 6, b.w + 12, b.h + 12,
                   O(91 + i, n.color, { strokeWidth: 1, roughness: 1.4 }));
      so = O(11 + i, n.color, { fill: "#ffffff", fillStyle: "solid", strokeWidth: 3 });
    }
    rc.rectangle(b.x, b.y, b.w, b.h, so);

    drawIcon(rc, n.icon, b.x + 32, b.cy, 15, n.color, O(31 + i, n.color));

    const t1 = document.createElementNS(svgNS, "text");
    t1.setAttribute("x", b.x + 60); t1.setAttribute("y", b.cy - 2);
    t1.setAttribute("font-size", "22"); t1.setAttribute("fill", INK);
    t1.textContent = n.label;
    svg.appendChild(t1);

    const t2 = document.createElementNS(svgNS, "text");
    t2.setAttribute("x", b.x + 60); t2.setAttribute("y", b.cy + 22);
    t2.setAttribute("font-size", "15"); t2.setAttribute("fill", "#758195");
    t2.textContent = n.sub;
    svg.appendChild(t2);
  }

  // ---- arrows (draw-on over first 3*ARROW_F frames)
  for (let k = 0; k < 3; k++) {
    const t = easeInOut((frame - k * ARROW_F) / ARROW_F);
    if (t <= 0) continue;
    const a = nodeBox(k), b2 = nodeBox(k + 1);
    const y = a.cy;
    const x0 = a.x + a.w + 6, x1 = b2.x - 6;
    const tip = x0 + (x1 - x0) * t;
    rc.line(x0, y, tip, y, O(51 + k, INK));
    if (t > 0.9) {
      rc.polygon([[tip, y], [tip - 13, y - 8], [tip - 13, y + 8]],
                 O(61 + k, INK, { fill: INK, fillStyle: "solid" }));
    }
  }

  // ---- packets
  function packet(prog, color, seed) {
    const pos = prog * 3;
    const seg = Math.min(Math.floor(pos), 2);
    const frac = pos - seg;
    const a = nodeBox(seg), b2 = nodeBox(seg + 1);
    const x = a.x + a.w + 6 + frac * (b2.x - 6 - (a.x + a.w + 6));
    const y = a.cy;
    // glow: two dashed sketchy circles
    rc.circle(x, y, 34, O(seed, color, { strokeWidth: 1, strokeLineDash: [4, 6] }));
    rc.circle(x, y, 22, O(seed + 1, color, { strokeWidth: 1 }));
    // solid core
    rc.circle(x, y, 14, O(seed + 2, color,
      { fill: color, fillStyle: "solid", stroke: color }));
  }

  let caption = null, capColor = null;
  if (frame >= ARROW_END && frame < REQ_END) {
    packet(easeInOut((frame - ARROW_END) / TRAVEL_F), REQ, 71);
    caption = "request  \u2192"; capColor = REQ;
  } else if (frame >= REQ_END && frame < RES_END) {
    packet(1 - easeInOut((frame - REQ_END) / TRAVEL_F), RES, 71);
    caption = "\u2190  response"; capColor = RES;
  }

  if (caption) {
    const c = document.createElementNS(svgNS, "text");
    c.setAttribute("x", W/2); c.setAttribute("y", H - 40);
    c.setAttribute("text-anchor", "middle");
    c.setAttribute("font-size", "22"); c.setAttribute("fill", capColor);
    c.textContent = caption;
    svg.appendChild(c);
  }
}

function activeNode(frame) {
  // which node the packet is currently passing (for the pulse effect)
  if (frame >= ARROW_END && frame < REQ_END) {
    return Math.min(3, Math.round(easeInOut((frame - ARROW_END) / TRAVEL_F) * 3));
  }
  if (frame >= REQ_END && frame < RES_END) {
    return Math.min(2, Math.round((1 - easeInOut((frame - REQ_END) / TRAVEL_F)) * 3));
  }
  return -1;
}

window.renderFrame = renderFrame;
window.TOTAL = TOTAL;
</script>
</body>
</html>
