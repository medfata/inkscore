# InkScore production stack (box):
#   postgres / api-server / web / cloudflared  — always on
#   indexer-* workers — HISTORICAL/LEGACY, gated behind profiles: [legacy]
#     (the app now reads explorer.inkonchain.com directly; those workers fed
#      the dropped indexer tables. Start manually only if ever needed:
#      docker compose --profile legacy up -d indexer-backfill)
#
# Log rotation for every service — without this json-file logs grow unbounded
# (bit us on the VPS root disk 2026-06-10).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    # Default 64MB /dev/shm OOMs parallel queries on the 32M-row tables
    shm_size: 512mb
    logging: *default-logging
    environment:
      POSTGRES_USER: ink
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ink_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    command: >
      postgres
      -c listen_addresses='*'
      -c password_encryption=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ink -d ink_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backfill Service - HISTORICAL/LEGACY: the in-house indexer era is over.
  # The app now reads explorer.inkonchain.com directly; its tables were dropped
  # (2026-09-07). Gated behind the 'legacy' profile so `up -d` never starts it.
  # Manual start if ever needed: docker compose --profile legacy up -d indexer-backfill
  indexer-backfill:
    build: .
    profiles: [legacy]
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ink:${DB_PASSWORD}@postgres:5432/ink_analytics
      RPC_URL: ${RPC_URL}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-15000}
    volumes:
      - csv_exports:/app/csv_exports
    command: npm run start:backfill

  # Realtime Service - Adaptive polling for new transactions
  # Polls active contracts every 15s, backs off idle ones up to 10min
  # Realtime Service - HISTORICAL/LEGACY (see indexer-backfill note)
  indexer-realtime:
    build: .
    profiles: [legacy]
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ink:${DB_PASSWORD}@postgres:5432/ink_analytics
      # Realtime depends on Routescan API (429-fix); blank falls back to no key
      ROUTESCAN_API_KEY: ${ROUTESCAN_API_KEY:-}
    command: npm run start:realtime

  # Event-Driven Enrichment Service - Optimized volume contract enrichment
  # - Handles small backlogs (<500 transactions) in real-time
  # - Uses database triggers for instant processing (no polling overhead)
  # - Leaves large backlogs for concurrent gap enrichment script
  # - 90% less resource usage vs old polling approach
  indexer-enrichment:
    build: .
    profiles: [legacy]
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ink:${DB_PASSWORD}@postgres:5432/ink_analytics
      # Enrichment reads Routescan too (see realtime note)
      ROUTESCAN_API_KEY: ${ROUTESCAN_API_KEY:-}
    command: npm run start:event-enrichment

  # Express API Server - Shared connection pool for dashboard endpoints
  # Solves PostgreSQL connection exhaustion from serverless functions
  api-server:
    build: ../api-server
    restart: always
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ink:${DB_PASSWORD}@postgres:5432/ink_analytics
      PORT: 4000
      # OpenSea buy/sale/mint counts; blank disables (opensea-service returns zeros)
      OPENSEA_API_KEY: ${OPENSEA_API_KEY:-}
      RPC_URL: ${RPC_URL}
      # Blockscout egress + pacing knobs. These MUST be listed here — values
      # in .env are invisible to the container otherwise (learned 2026-09-06:
      # the box silently ran code defaults for weeks because only DATABASE_URL
      # et al. were listed).
      BLOCKSCOUT_PROXY: ${BLOCKSCOUT_PROXY:-hybrid}
      BLOCKSCOUT_RATE_LIMIT: ${BLOCKSCOUT_RATE_LIMIT:-120}
      BLOCKSCOUT_MAX_CONCURRENT: ${BLOCKSCOUT_MAX_CONCURRENT:-10}
      PROXY_URL_LIST_FILE: ${PROXY_URL_LIST_FILE:-}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=2048}
      REFRESH_WORKER: ${REFRESH_WORKER:-on}
      SCORE_SNAPSHOT_WORKER: ${SCORE_SNAPSHOT_WORKER:-on}
      SNAPSHOT_MAX_AGE_MIN: ${SNAPSHOT_MAX_AGE_MIN:-60}
      WALLET_CACHE_TTL_MIN: ${WALLET_CACHE_TTL_MIN:-60}
      # Catch-up worker (24h activity sweeps): off by default — prod opts in
      # via .env. Dev machines must NEVER enqueue against the shared queue.
      CATCHUP_WORKER: ${CATCHUP_WORKER:-off}
      CATCHUP_TOP_N: ${CATCHUP_TOP_N:-200}
      CATCHUP_TOP_INTERVAL_HOURS: ${CATCHUP_TOP_INTERVAL_HOURS:-6}
      CATCHUP_INTERVAL_HOURS: ${CATCHUP_INTERVAL_HOURS:-24}
      # Phase 2 (instant loads + warm sweep tuning). Quiet serving: a snapshot
      # older than the freshness window may serve instantly when a probe proves
      # no newer tx exists. QUIET_SERVE_SINCE gates it to snapshots captured at
      # or after that instant (set it to the first accurate-code deploy).
      QUIET_SERVE_SINCE: ${QUIET_SERVE_SINCE:-}
      QUIET_PROBE_REUSE_MIN: ${QUIET_PROBE_REUSE_MIN:-5}
      SNAPSHOT_REFRESH_MIN_AGE_MIN: ${SNAPSHOT_REFRESH_MIN_AGE_MIN:-45}
      SNAPSHOT_SWEEP_WALLETS: ${SNAPSHOT_SWEEP_WALLETS:-50}
      REFRESH_WORKER_BATCH: ${REFRESH_WORKER_BATCH:-20}
      REFRESH_WORKER_CONCURRENCY: ${REFRESH_WORKER_CONCURRENCY:-2}
      INCOMPLETE_SWEEP_LIMIT: ${INCOMPLETE_SWEEP_LIMIT:-40}
      # Shared secret gating the /api/admin/proxies endpoints (web forwards
      # after its own wallet-signature admin check). Empty = endpoints 503.
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:-}
    volumes:
      # Optional ProxyScrape-style list for hybrid mode. If the host file is
      # absent this mounts an empty dir — the reader fails gracefully and the
      # box just runs direct-only.
      - ${PROXY_LIST_HOST_PATH:-/root/proxyscrape-list.txt}:/proxyscrape-list.txt:ro
    ports:
      - "4000:4000"
    healthcheck:
      # 127.0.0.1 not localhost: in-container 'localhost' can resolve to IPv6
      # ::1 first (same Alpine/standalone gotcha as the web healthcheck below).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Frontend + API - migrated off Vercel.
  # Builds the repo-root Dockerfile (standalone output). Internal only;
  # cloudflared provides public ingress. Reaches api-server over this network.
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
        NEXT_PUBLIC_NFT_CONTRACT_ADDRESS: ${NEXT_PUBLIC_NFT_CONTRACT_ADDRESS}
        NEXT_PUBLIC_ENABLE_STREAMING: ${NEXT_PUBLIC_ENABLE_STREAMING:-true}
    restart: always
    logging: *default-logging
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      api-server:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ink:${DB_PASSWORD}@postgres:5432/ink_analytics
      API_SERVER_URL: http://api-server:4000
      # ranks/route.ts reads NEXT_PUBLIC_API_URL (not API_SERVER_URL); supply both
      NEXT_PUBLIC_API_URL: http://api-server:4000
      ADMIN_WALLETS: ${ADMIN_WALLETS}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
      NEXT_PUBLIC_NFT_CONTRACT_ADDRESS: ${NEXT_PUBLIC_NFT_CONTRACT_ADDRESS}
      NEXT_PUBLIC_ENABLE_STREAMING: ${NEXT_PUBLIC_ENABLE_STREAMING:-true}
      # nft/authorize/route.ts signs mint authorizations with this key
      NFT_SIGNER_PRIVATE_KEY: ${NFT_SIGNER_PRIVATE_KEY}
      # google-sheets-service (colab requests); private key keeps \n escaped in .env
      GOOGLE_CLIENT_EMAIL: ${GOOGLE_CLIENT_EMAIL}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY}
      GOOGLE_SHEET_COLAB_REQUEST_ID: ${GOOGLE_SHEET_COLAB_REQUEST_ID}
      RPC_URL: ${RPC_URL:-https://rpc-gel.inkonchain.com}
      # staking page resolves NFT images via OpenSea CDN (server-side key)
      OPENSEA_API_KEY: ${OPENSEA_API_KEY}
      # points-service-v2 self-fetch base; default resolves inside the container
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # First-paint budget for the streaming dashboard's bundle fast path: a
      # cold gather past this falls through to per-metric streaming.
      STREAM_BUNDLE_TIMEOUT_MS: ${STREAM_BUNDLE_TIMEOUT_MS:-4000}
      # Shared secret for api-server /api/admin/proxies forwarding (server-side only)
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:-}
    expose:
      - "3000"
    healthcheck:
      # 127.0.0.1 not localhost: the standalone server binds IPv4 0.0.0.0, but
      # in-container 'localhost' resolves to IPv6 ::1 -> probe gets ECONNREFUSED.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cloudflare Tunnel - public ingress with zero open inbound ports.
  # Create the tunnel in the Cloudflare Zero Trust dashboard, route the hostname
  # to http://web:3000, and put the token in .env as CF_TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    logging: *default-logging
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  csv_exports:
